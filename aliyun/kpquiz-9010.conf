# 知识点闯关 · 阿里云轻量服务器独立端口配置（与 badtogo 同一做法）
# 放置位置：/etc/nginx/conf.d/kpquiz.conf   站点目录：/var/www/kpquiz
# 访问：http://39.96.207.137:9010   （需在阿里云控制台防火墙放行 9010）
server {
    listen 9010;
    listen [::]:9010;
    server_name _;
    root /var/www/kpquiz;
    index index.html;
    charset utf-8;
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location = /sw.js { default_type application/javascript; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
