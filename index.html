<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="知识点闯关">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>img{max-width:100%}[hidden]{display:none!important}</style>
<title>知识点闯关</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --paper:#F4F5EF; --card:#FFFFFF; --sunk:#EBEDE6;
  --ink:#1F2A26; --ink2:#56635E; --ink3:#8A948F; --line:#D8DED7; --grid:#E4E9E2;
  --yw:#C8412B; --yw-bg:#FBEAE6; --sx:#2C5DA6; --sx-bg:#E6EEF9; --yy:#25845F; --yy-bg:#E3F2EA;
  --ok:#2E8B57; --ok-bg:#E3F2EA; --bad:#D9432F; --bad-bg:#FBEAE6;
  --b0:#E4E9E2; --b1:#C3CBC5; --b2:#C98A4B; --b3:#9FB0BC; --b4:#EDB21A; --b4-bg:#FFF3C7;
  --focus:#2C5DA6;
  --shadow:0 1px 0 rgba(31,42,38,.05),0 8px 24px -16px rgba(31,42,38,.35);
  --disp:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --en:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A18; --card:#1E2522; --sunk:#171D1A;
    --ink:#ECEFEA; --ink2:#B4BDB7; --ink3:#7E8883; --line:#2E3733; --grid:#222A26;
    --yw:#E8705A; --yw-bg:#3A221D; --sx:#6C9BE0; --sx-bg:#1C2A3E; --yy:#4FB88C; --yy-bg:#183026;
    --ok:#4FB88C; --ok-bg:#183026; --bad:#E8705A; --bad-bg:#3A221D;
    --b0:#262E2A; --b1:#3C4641; --b2:#B77A3E; --b3:#8B9BA8; --b4:#F1BE3A; --b4-bg:#3A3010;
    --focus:#6C9BE0;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#151A18; --card:#1E2522; --sunk:#171D1A;
  --ink:#ECEFEA; --ink2:#B4BDB7; --ink3:#7E8883; --line:#2E3733; --grid:#222A26;
  --yw:#E8705A; --yw-bg:#3A221D; --sx:#6C9BE0; --sx-bg:#1C2A3E; --yy:#4FB88C; --yy-bg:#183026;
  --ok:#4FB88C; --ok-bg:#183026; --bad:#E8705A; --bad-bg:#3A221D;
  --b0:#262E2A; --b1:#3C4641; --b2:#B77A3E; --b3:#8B9BA8; --b4:#F1BE3A; --b4-bg:#3A3010;
  --focus:#6C9BE0;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:16px 16px 92px}
.screen[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h1{font-family:var(--disp);font-size:30px;line-height:1.2;letter-spacing:.02em}
h2{font-family:var(--disp);font-size:22px;line-height:1.25}
h3{font-size:15px;font-weight:700;color:var(--ink2)}
p{margin:0}
.muted{color:var(--ink3);font-size:14px}
.en{font-family:var(--en);font-weight:800}
.num{font-family:var(--en);font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- 首页 ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--ink3);margin-bottom:4px}
.streak{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.streak b{font-family:var(--en);font-size:30px;color:var(--yw)}
.streak span{font-size:12px;color:var(--ink3)}
.hero{
  background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);
  padding:20px 20px 18px;margin-bottom:16px;position:relative;overflow:hidden;
}
.hero .kicker{font-size:13px;color:var(--ink2);margin-bottom:6px}
.hero h2{font-size:26px;margin-bottom:12px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink2);margin-bottom:16px}
.hero .meta b{font-family:var(--en);font-size:15px;color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 22px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:var(--disp);font-size:20px;letter-spacing:.04em;border-radius:6px;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(2px)}
.btn.big{width:100%;min-height:60px;font-size:23px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:40px;font-size:16px;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.done-badge{
  position:absolute;top:14px;right:-34px;transform:rotate(35deg);background:var(--ok);color:#fff;
  font-size:12px;letter-spacing:.1em;padding:3px 40px;
}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.subj{
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 12px 12px;
  text-align:left;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--c);
}
.subj .name{font-family:var(--disp);font-size:21px;color:var(--c)}
.subj .bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.subj .bar i{display:block;height:100%}
.subj .bar .g{background:var(--b4)} .subj .bar .s{background:var(--b3)} .subj .bar .c{background:var(--b2)} .subj .bar .l{background:var(--b1)}
.subj .stat{font-size:12px;color:var(--ink3);display:flex;justify-content:space-between}
.subj .stat b{font-family:var(--en);color:var(--ink)}
.subj.yw{--c:var(--yw)} .subj.sx{--c:var(--sx)} .subj.yy{--c:var(--yy)}
.note{background:var(--card);border:1px solid var(--line);padding:14px 16px;font-size:14px;color:var(--ink2);line-height:1.6}
.note b{color:var(--ink)}

/* ---------- 答题 ---------- */
.qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qbar .x{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:50%;font-size:20px;line-height:1}
.prog{flex:1;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s ease}
.qbar .cnt{font-family:var(--en);font-size:14px;color:var(--ink2);min-width:44px;text-align:right}
.qcard{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 18px 20px;flex:1;display:flex;flex-direction:column;gap:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.tag .pill{padding:1px 8px;border-radius:3px;color:#fff;font-family:var(--disp);font-size:13px;letter-spacing:.06em}
.pill.yw{background:var(--yw)} .pill.sx{background:var(--sx)} .pill.yy{background:var(--yy)}
.prompt{font-size:24px;line-height:1.45;font-weight:600;text-wrap:balance}
.prompt .en{font-size:30px}
.prompt .blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--ink);text-align:center;color:var(--sx);margin:0 3px}
.prompt .zh{font-size:15px;font-weight:400;color:var(--ink3);display:block;margin-top:6px}
.prompt .big{font-family:var(--en);font-size:38px;letter-spacing:.02em}
.spk{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:44px;padding:0 14px;border:2px solid var(--sx);color:var(--sx);border-radius:22px;font-weight:700;font-size:15px}
.spk:active{background:var(--sx-bg)}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  min-height:56px;padding:10px 16px;border:2px solid var(--line);background:var(--card);border-radius:8px;
  font-size:20px;text-align:left;display:flex;align-items:center;gap:12px;line-height:1.3;
}
.opt .k{font-family:var(--en);font-size:13px;color:var(--ink3);width:18px;flex:none}
.opt.en{font-family:var(--en);font-weight:800;font-size:22px}
.opt:active{background:var(--sunk)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{pointer-events:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:48px;padding:6px 14px;border:2px solid var(--line);background:var(--card);border-radius:8px;font-size:20px;font-family:var(--en);font-weight:800}
.tile.zh{font-family:var(--body);font-weight:600;font-size:18px}
.tile.used{opacity:.25;pointer-events:none}
.answer-row{min-height:60px;border:2px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer-row.right{border-color:var(--ok);border-style:solid;background:var(--ok-bg)}
.answer-row.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}
.answer-row .tile{border-color:var(--ink)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px}
.numpad button{min-height:52px;border:2px solid var(--line);background:var(--card);border-radius:8px;font-family:var(--en);font-size:24px;font-weight:800}
.numpad button:active{background:var(--sunk)}
.numin{font-family:var(--en);font-size:40px;font-weight:800;min-height:56px;border-bottom:3px solid var(--ink);padding:0 8px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.numin.right{color:var(--ok);border-color:var(--ok)} .numin.wrong{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:10px;margin-top:auto}
.fb{border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.fb .head{font-family:var(--disp);font-size:22px}
.fb.ok .head{color:var(--ok)} .fb.bad .head{color:var(--bad)}
.fb .exp{font-size:15px;color:var(--ink2);line-height:1.6}
.fb .exp b{color:var(--ink)}
.net{display:inline-grid;gap:2px;margin:4px 0}
.net i{width:26px;height:26px;background:var(--sx);border-radius:2px;display:block}
.net i.o{background:transparent}

/* ---------- 结算 ---------- */
.result{background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow);padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .score{font-family:var(--en);font-size:56px;line-height:1;color:var(--ink)}
.result .score small{font-size:20px;color:var(--ink3)}
.ups{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:13px;padding:3px 10px;border-radius:12px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.chip.up{background:var(--b4-bg);color:var(--ink);border-color:var(--b4)}
.chip.down{background:var(--bad-bg);border-color:var(--bad)}

/* ---------- 地图 ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-family:var(--disp);font-size:18px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.unit{margin-bottom:18px}
.unit h3{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.unit h3 span{font-family:var(--en);font-weight:600;color:var(--ink3);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.kt{
  aspect-ratio:1;border-radius:6px;background:var(--b0);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;
  font-size:12px;line-height:1.2;color:var(--ink2);overflow:hidden;
}
.kt.en{font-family:var(--en);font-weight:800;font-size:13px}
.kt.b1{background:var(--b1);color:var(--ink)} .kt.b2{background:var(--b2);color:#fff;border-color:transparent}
.kt.b3{background:var(--b3);color:#fff;border-color:transparent} .kt.b4{background:var(--b4);color:#3B2E00;border-color:transparent}
.kt.due{box-shadow:inset 0 0 0 2px var(--yw)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink3);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.sheet .in{pointer-events:auto;width:100%;max-width:640px;background:var(--card);border-top:2px solid var(--ink);box-shadow:0 -10px 30px rgba(0,0,0,.2);padding:18px 18px 24px}
.sheet .in h2{margin-bottom:6px}
.sheet .row{display:flex;gap:16px;font-size:14px;color:var(--ink2);margin:8px 0 14px}
.sheet .row b{font-family:var(--en);color:var(--ink)}

/* ---------- 听写 ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--card);border:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.li .t{flex:1}
.li .t b{display:block;font-size:17px}
.li .t span{font-size:13px;color:var(--ink3)}
.li .pill{color:#fff;font-family:var(--disp);padding:2px 8px;border-radius:3px;font-size:13px}
.dict-word{font-family:var(--en);font-size:44px;text-align:center;padding:30px 0}
.dict-word.zh{font-family:var(--body);font-weight:700}
.check{display:grid;grid-template-columns:1fr auto;gap:6px}
.check .w{padding:10px 12px;background:var(--card);border:1px solid var(--line);font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
.check .w .pn{font-size:13px;color:var(--ink3);font-weight:400}
.check .w.en{font-family:var(--en);font-weight:800}
.check .yn{display:flex;gap:6px}
.check .yn button{width:48px;border:2px solid var(--line);border-radius:6px;background:var(--card);font-size:20px}
.check .yn button.y.on{border-color:var(--ok);background:var(--ok-bg)} .check .yn button.n.on{border-color:var(--bad);background:var(--bad-bg)}

/* ---------- 家长 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);padding:12px;text-align:center}
.st b{display:block;font-family:var(--en);font-size:26px;line-height:1.1}
.st span{font-size:12px;color:var(--ink3)}
.sec{background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.sec h3{margin-bottom:10px;display:flex;justify-content:space-between}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink3);font-weight:600}
td.n{font-family:var(--en);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hist{display:flex;gap:4px;align-items:flex-end;height:60px}
.hist i{flex:1;background:var(--sx);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.hist i.z{background:var(--sunk)}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:8px;user-select:text;-webkit-user-select:text}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.tiny{font-size:14px;min-height:38px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:6px}
.tiny.danger{color:var(--bad);border-color:var(--bad)}

/* ---------- 底栏 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;width:100%;max-width:640px;display:flex;background:var(--card);border-top:2px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--disp);font-size:15px;color:var(--ink3);border-radius:6px}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--ink);background:var(--sunk)}
.nav[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:400px){.prompt{font-size:21px}.opt{font-size:18px}.subjects{gap:6px}.subj .name{font-size:18px}}
</style>
</head>
<body>
<div class="app">

<!-- 首页 -->
<section class="screen" id="s-home">
  <div class="top">
    <div>
      <div class="eyebrow">三年级 · 上册</div>
      <h1>知识点闯关</h1>
    </div>
    <div class="streak"><b id="streak">0</b><span>连续天数</span></div>
  </div>
  <div class="hero" id="hero">
    <div class="kicker" id="hero-kicker">今天的关卡</div>
    <h2 id="hero-title">今日闯关</h2>
    <div class="meta">
      <span>要复习 <b id="m-due">0</b> 个</span>
      <span>新知识点 <b id="m-new">0</b> 个</span>
      <span>大约 <b id="m-min">6</b> 分钟</span>
    </div>
    <button class="btn big" id="btn-start">开始 ▸</button>
  </div>
  <div class="subjects" id="subjects"></div>
  <p class="note" id="home-note"></p>
</section>

<!-- 答题 -->
<section class="screen" id="s-quiz" hidden>
  <div class="qbar">
    <button class="x" id="btn-quit" aria-label="退出">×</button>
    <div class="prog"><i id="prog"></i></div>
    <div class="cnt num" id="cnt">1/15</div>
  </div>
  <div class="qcard" id="qcard"></div>
</section>

<!-- 结算 -->
<section class="screen" id="s-done" hidden>
  <div class="result" id="result"></div>
</section>

<!-- 地图 -->
<section class="screen" id="s-map" hidden>
  <div class="top"><div><div class="eyebrow">知识点地图</div><h1>点亮它们</h1></div></div>
  <div class="tabs" id="map-tabs"></div>
  <div class="legend">
    <span><i style="background:var(--b0)"></i>没见过</span>
    <span><i style="background:var(--b1)"></i>刚学</span>
    <span><i style="background:var(--b2)"></i>铜</span>
    <span><i style="background:var(--b3)"></i>银</span>
    <span><i style="background:var(--b4)"></i>金</span>
    <span><i style="box-shadow:inset 0 0 0 2px var(--yw)"></i>今天该复习</span>
  </div>
  <div id="map-body"></div>
</section>

<!-- 听写 -->
<section class="screen" id="s-dict" hidden>
  <div class="top"><div><div class="eyebrow">报听写</div><h1>我来念，你来写</h1></div></div>
  <div id="dict-body"></div>
</section>

<!-- 家长 -->
<section class="screen" id="s-parent" hidden>
  <div class="top"><div><div class="eyebrow">家长看板</div><h1>学到哪了</h1></div></div>
  <div id="parent-body"></div>
</section>

</div>

<script>
/* ================= 题库 · 语文 + 数学 =================
   KP = {id, s:'yw'|'sx'|'yy', u:单元, name, lesson, items:[...]}
   item.t: mc(选择) tf(对错) blank(挖空选词) order(排顺序) num(数字)
   ====================================================== */
const KPS = [];
function kp(o){ KPS.push(o); return o; }
// 近/反义词一组生成多种问法
function pairKP(id,s,u,name,kind,pairs,lesson){
  const items=[];
  const all=pairs.map(p=>p[1]);
  pairs.forEach(([w,a])=>{
    const ds=all.filter(x=>x!==a);
    items.push({t:'mc',q:`「${w}」的${kind}是哪个？`,o:[a,...pick(ds,3)],a:0,
      exp: kind==='近义词'?`「${w}」和「${a}」意思差不多，可以互相替换着说。`:`「${w}」和「${a}」意思正好相反，像跷跷板的两头。`});
  });
  return kp({id,s,u,name,lesson,items});
}
function pick(arr,n){ const c=arr.slice(); const r=[]; while(r.length<n&&c.length){ r.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); } return r; }

  {t:'blank',q:'遥望洞庭山水翠，白银盘里一【青螺】。',o:['青山','明珠','小船'],exp:'湖中的君山像盘子里一颗青青的田螺。'},
  {t:'mc',q:'诗里的「白银盘」比喻什么？',o:['月光下平静的洞庭湖湖面','天上的月亮','一个真的盘子','湖边的沙滩'],a:0,exp:'湖面又平又亮，像银盘子。'},
  {t:'mc',q:'诗里的「青螺」比喻什么？',o:['湖中间青翠的君山','一只田螺','一片荷叶','远处的船'],a:0,exp:'君山又小又青，像盘子里的一颗田螺。'},
  {t:'mc',q:'「遥望」的意思是？',o:['远远地看','低头看','闭上眼睛','回头看'],a:0,exp:'遥就是远，遥望就是从很远的地方望过去。'},
 ]});
kp({id:'yw2-sx',s:'yw',u:2,name:'诗句：山行',
 lesson:'「停车坐爱枫林晚，霜叶红于二月花。」这里最容易错的是「坐」：不是坐下，是「因为」！诗人杜牧把车停下来，是因为太喜欢傍晚的枫林。「红于」是「比……更红」：被霜打过的枫叶，比二月的春花还要红。',
 items:[
  {t:'mc',q:'「停车坐爱枫林晚」中的「坐」是什么意思？',o:['因为','坐下','乘坐','座位'],a:0,exp:'坐 = 因为。因为喜爱枫林，所以停车。这个字最容易错。'},
  {t:'mc',q:'「霜叶红于二月花」中的「红于」是什么意思？',o:['比……更红','红色的','在……红','变红了'],a:0,exp:'于在这里是「比」。霜叶比二月的花还红。'},
  {t:'mc',q:'「霜叶」指的是？',o:['被秋霜染红的枫叶','结了霜的草叶','冬天的树叶','白色的叶子'],a:0,exp:'秋天霜一打，枫叶就红了。'},
  {t:'blank',q:'停车坐爱枫林晚，霜叶红于【二月花】。',o:['三月花','满山花','天边霞'],exp:'拿秋天的红叶和春天二月的花比，红叶更红。'},
  {t:'mc',q:'诗人为什么停下车？',o:['因为喜爱傍晚的枫林美景','因为车坏了','因为天黑了','因为累了'],a:0,exp:'停车「坐」爱枫林晚：因为喜爱枫林。'},
 ]});
kp({id:'yw2-zy',s:'yw',u:2,name:'古诗《舟夜书所见》',
 lesson:'清朝查慎行（查读 zhā）晚上坐船，写下看到的景色。天很黑，只看见一盏渔火，像一点萤火虫的光。微风一吹，水面起了小浪，那一点光被打散，变成满河的星星。从「一点」到「满河」，这是全诗最好看的一笔。',
 items:[
  {t:'blank',q:'月黑见渔灯，孤光一点【萤】。',o:['星','灯','光'],exp:'孤零零的一点光，像萤火虫。'},
  {t:'blank',q:'微微风簇浪，散作【满河星】。',o:['一片光','满天星','点点灯'],exp:'风把水面吹皱，那一点光碎成满河的星星。'},
  {t:'mc',q:'《舟夜书所见》的作者是谁？',o:['查慎行','袁枚','杜牧','刘禹锡'],a:0,exp:'清朝的查慎行。「查」在这里读 zhā。'},
  {t:'mc',q:'「舟夜书所见」这个题目是什么意思？',o:['夜里在船上写下看到的景色','白天划船看风景','夜里在船上读书','写一艘夜里的船'],a:0,exp:'舟是船，书是写，所见是看到的。'},
  {t:'mc',q:'为什么渔灯的光会「散作满河星」？',o:['风吹起了小浪，把光打散映在水面上','天上真的有很多星星','有很多船一起点了灯','萤火虫飞来了'],a:0,exp:'「微微风簇浪」：风一吹，水面碎了，光也跟着碎成一片。'},
 ]});
kp({id:'yw2-rj',s:'yw',u:2,name:'习作《写日记》',
 lesson:'日记就是「今天的事，写给以后的自己看」。开头一行写清楚日期、星期、天气。内容不用惊天动地，看到的、听到的、想到的、做过的、甚至梦到的都可以写。这一单元的主题是秋天，留心看看身边什么变了。',
 items:[
  {t:'mc',q:'日记的第一行一般要写什么？',o:['日期、星期、天气','自己的名字','老师的名字','一句名言'],a:0,exp:'日期、星期、天气，三样写在最前面。'},
  {t:'mc',q:'下面哪些内容可以写进日记？',o:['看到的、想到的、听到的、做过的都可以','只能写开心的事','只能写学习的事','只能写发生在学校的事'],a:0,exp:'见闻和感受都行，日记是自己的。'},
 ]});

/* ---------------- 数学 · 第一单元 观察物体 ---------------- */
kp({id:'sx1-jc',s:'sx',u:1,name:'观察的方位和规律',
 lesson:'看一个东西，可以从前面、后面、左面、右面、上面五个方向看。同一个东西，换个位置看，样子经常不一样：一个杯子从上面看是圆的，从前面看却是长方形。做题时先问自己：我站在哪儿？',
 items:[
  {t:'mc',q:'我们通常从几个方向观察物体？',o:['前、后、左、右、上','只有前面','前和后','上和下'],a:0,exp:'五个方向：前面、后面、左面、右面、上面。'},
  {t:'tf',q:'从不同位置看同一个物体，看到的形状一定一样。',a:false,exp:'换个位置，看到的样子常常不一样。杯子从上面看是圆，从前面看是长方形。'},
  {t:'mc',q:'观察物体时，眼睛应该怎么看？',o:['正对物体，视线垂直物体表面','斜着看','闭一只眼','从很远的地方看'],a:0,exp:'正对着、视线垂直，看到的形状才准。'},
 ]});
kp({id:'sx1-3m',s:'sx',u:1,name:'最多看到 3 个面',
 lesson:'拿一个盒子放桌上，站在一个地方不动，你最多能看见几个面？试试就知道：最多 3 个（比如前面、上面、右面）。后面和下面被挡住了，左面也看不到。想看更多，只能换位置。',
 items:[
  {t:'mc',q:'站在一个固定位置看一个长方体盒子，最多能看到几个面？',o:['3 个','6 个','4 个','2 个'],a:0,exp:'最多 3 个。后面、下面和另一个侧面都被挡住了。'},
  {t:'tf',q:'站在一个地方不动，能同时看到正方体的 4 个面。',a:false,exp:'最多只能看到 3 个面。'},
  {t:'mc',q:'一个正方体有几个面？',o:['6 个','4 个','8 个','3 个'],a:0,exp:'前后左右上下，一共 6 个面。'},
 ]});
kp({id:'sx1-lr',s:'sx',u:1,name:'左右以谁为准',
 lesson:'判断左右，要以「看的人」为准，不是以物体自己为准。还有一个规律：站在物体的前面和后面看（两个正对着的位置），看到的图形一般是左右相反的，就像照镜子。',
 items:[
  {t:'mc',q:'判断物体的左面、右面，要站在谁的角度？',o:['观察者（看的人）','物体自己','老师','都可以'],a:0,exp:'以看的人为准。'},
  {t:'mc',q:'小明站在物体前面看，小红站在物体后面看，他们看到的图形一般是？',o:['左右相反','完全一样','上下相反','颜色不同'],a:0,exp:'前面和后面正对着，看到的图形左右相反，像照镜子。'},
  {t:'tf',q:'从物体的左面和右面观察，看到的图形一般左右相反。',a:true,exp:'左面和右面也是一对相对的位置，规律一样。'},
 ]});
kp({id:'sx1-st',s:'sx',u:1,name:'常见几何体的视图',
 lesson:'四个几何体的「照片」：正方体，哪面看都是正方形。长方体，一般看到长方形（碰巧也可能是正方形）。圆柱，从上面看是圆，从前面看是长方形（碰巧也可能是正方形）。球最简单，从哪儿看都是圆。',
 items:[
  {t:'mc',q:'一个圆柱，从上面看是什么形状？',o:['圆形','长方形','正方形','三角形'],a:0,exp:'圆柱的上下底面是圆。'},
  {t:'mc',q:'一个圆柱，从前面看是什么形状？',o:['长方形或正方形','圆形','三角形','梯形'],a:0,exp:'从侧面看圆柱，看到的是长方形（矮胖的圆柱可能是正方形）。'},
  {t:'mc',q:'一个球，从任何方向看都是什么形状？',o:['圆形','正方形','椭圆','看方向'],a:0,exp:'球从哪儿看都是圆。'},
  {t:'mc',q:'从前面看是正方形的立体图形，可能是哪个？',o:['正方体，也可能是长方体','只能是正方体','只能是球','只能是圆柱'],a:0,exp:'长方体也可能有一个面是正方形，光看一个面不能下结论。'},
  {t:'tf',q:'看到一个面是正方形，这个立体图形一定是正方体。',a:false,exp:'不一定！长方体也可能有正方形的面。只看一个面不能确定。'},
 ]});
kp({id:'sx1-sz',s:'sx',u:1,name:'骰子相对面的和是 7',
 lesson:'标准骰子上，正对着的两个面数字加起来总是 7：1 对 6，2 对 5，3 对 4。所以看到一个面是 3，它背面一定是 4。注意：这是标准骰子的规定，普通正方体没有这个特点。',
 items:[
  {t:'mc',q:'标准骰子上，相对两个面的数字加起来是多少？',o:['7','6','8','10'],a:0,exp:'1+6、2+5、3+4，都等于 7。'},
  {t:'num',q:'骰子朝上的面是 3，那么朝下的面是几？',a:4,exp:'7 − 3 = 4。'},
  {t:'num',q:'骰子朝上的面是 1，那么朝下的面是几？',a:6,exp:'7 − 1 = 6。'},
  {t:'num',q:'骰子前面是 5，它的后面是几？',a:2,exp:'7 − 5 = 2。'},
  {t:'tf',q:'所有的正方体，相对两个面上的数字和都是 7。',a:false,exp:'只有标准骰子才有这个规定，普通正方体没有。'},
 ]});
kp({id:'sx1-zh',s:'sx',u:1,name:'看拼搭的组合体',
 lesson:'几个小方块搭在一起，怎么看？从前面看：数有几列、每列几层。从上面看：看底下的方块怎么摆。从左面或右面看：数有几行、每行几层。被挡住的方块看不见，画图时不用画出来。',
 items:[
  {t:'mc',q:'从前面观察拼搭的立体图形，主要看什么？',o:['有几列，每一列有几层','有几行','底面怎么摆','颜色'],a:0,exp:'前面看：数列数和每列的层数。'},
  {t:'mc',q:'从上面观察拼搭的立体图形，主要看什么？',o:['底面方块怎么摆放','每列有几层','有几行','最高的那块'],a:0,exp:'从上面往下看，看到的是底面的摆放。'},
  {t:'tf',q:'画从某个方向看到的图形时，被挡住的方块也要画出来。',a:false,exp:'挡住的看不见，看不见就不画。'},
  {t:'mc',q:'题目里几个同学围着物体看，怎么判断谁看到什么？',o:['想象自己站到那个同学的位置去看','随便选一个','看谁离得近','看谁个子高'],a:0,exp:'把自己「搬」到那个位置，想象看到的样子。'},
 ]});
kp({id:'sx1-zk',s:'sx',u:1,name:'长方体展开图',
 lesson:'把一个长方体纸盒剪开摊平，就是展开图。长方体有 6 个面，正对着的两个面一模一样，而且永远不挨着。要把没开口的盒子摊平，至少要剪开 7 条棱，剪法不同，摊出来的形状也不同。',
 items:[
  {t:'mc',q:'长方体一共有几个面？',o:['6 个','4 个','8 个','12 个'],a:0,exp:'上下、前后、左右，一共 6 个面。'},
  {t:'mc',q:'长方体相对的两个面有什么关系？',o:['完全相同，而且不相邻','大小不同','挨在一起','一定是正方形'],a:0,exp:'相对的面一模一样，并且永远不挨着。'},
  {t:'num',q:'一个没有开口的长方体纸盒，要展开平铺，至少剪开几条棱？',a:7,exp:'长方体有 12 条棱，至少剪 7 条才能摊平，剩下 5 条连着面。'},
  {t:'tf',q:'同一个长方体纸盒，不管怎么剪，展开图的形状都一样。',a:false,exp:'剪的棱不一样，摊开的形状就不一样。'},
  {t:'tf',q:'展开纸盒时，每个面至少要有一条边和别的面连着。',a:true,exp:'不能剪散，面和面要连着，才叫展开图。'},
 ]});
kp({id:'sx1-zf',s:'sx',u:1,name:'正方体展开图',
 lesson:'6 个正方形拼在一起，有的能折成正方体，有的不能。最好记的口诀：「田字格」不能折（四个格子拼成田字的，折起来会有两个面重叠）。找相对面的规律：挨在一起的两个面是相邻面，永远不可能是相对面。',
 items:[
  {t:'mc',q:'含有「田字格」的平面图形，能折成正方体吗？',o:['不能','能','有时能','看大小'],a:0,exp:'田字格折起来会有面重叠，折不成。'},
  {t:'mc',q:'在正方体展开图里，挨在一起的两个面折起来后是？',o:['相邻面','相对面','同一个面','不确定'],a:0,exp:'挨着的折起来还是挨着，是相邻面，不可能是相对面。'},
  {t:'tf',q:'正方体展开图中，相邻的两个面一定不是相对面。',a:true,exp:'这是找对面的关键规律。'},
  {t:'mc',html:'<div class="net" style="grid-template-columns:repeat(4,26px)"><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i><i></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i></div>',q:'上面这个图形能折成正方体吗？',o:['能','不能'],a:0,exp:'中间一排四个，上下各一个，这是最常见的能折成正方体的样子（1-4-1 型）。'},
  {t:'mc',html:'<div class="net" style="grid-template-columns:repeat(4,26px)"><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i></div>',q:'上面这个图形能折成正方体吗？',o:['不能','能'],a:0,exp:'左上角是一个田字格，折起来会重叠，不能折成正方体。'},
  {t:'mc',html:'<div class="net" style="grid-template-columns:repeat(4,26px)"><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i></i></div>',q:'上面这个图形能折成正方体吗？',o:['能','不能'],a:0,exp:'像楼梯一样 2-2-2 排列，能折成正方体。'},
  {t:'mc',html:'<div class="net" style="grid-template-columns:repeat(5,26px)"><i></i><i></i><i></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i></div>',q:'上面这个图形能折成正方体吗？',o:['不能','能'],a:0,exp:'一排有 5 个，折起来两头会撞在一起。一排最多只能有 4 个。'},
 ]});
kp({id:'sx1-tl',s:'sx',u:1,name:'视图推理',
 lesson:'只告诉你「从上面看是一个正方形」，能猜出是什么立体图形吗？不能！可能是正方体，也可能是长方体。一个方向的图只能帮你排除一些（比如肯定不是球），多看几个方向，才能一点点缩小范围。',
 items:[
  {t:'tf',q:'只知道从一个方向看到的图形，就能确定这个立体图形的唯一形状。',a:false,exp:'一个方向不够，有很多种搭法都可能看到同样的图。'},
  {t:'mc',q:'从上面看到一个圆，这个立体图形不可能是？',o:['正方体','球','圆柱','以上都可能'],a:0,exp:'正方体从哪儿看都是正方形，不可能看到圆。'},
  {t:'mc',q:'想更准确地知道立体图形的样子，应该？',o:['结合多个方向看到的图形','只看前面','只看上面','猜一个'],a:0,exp:'多个方向的图合在一起，范围就越来越小。'},
  {t:'mc',q:'从上面看是圆形，从前面看是长方形，这个立体图形是？',o:['圆柱','球','正方体','长方体'],a:0,exp:'上面是圆、前面是长方形，只有圆柱符合。'},
 ]});

/* ---------------- 数学 · 第二单元 混合运算 ---------------- */
kp({id:'sx2-jb',s:'sx',u:2,name:'一级运算和二级运算',
 lesson:'加法、减法是「一级运算」，乘法、除法是「二级运算」。记法：二级比一级「高一级」，所以算的时候先算高的（乘除），再算低的（加减）。',
 items:[
  {t:'mc',q:'加法和减法叫什么运算？',o:['一级运算','二级运算','高级运算','混合运算'],a:0,exp:'加减是一级。'},
  {t:'mc',q:'乘法和除法叫什么运算？',o:['二级运算','一级运算','三级运算','简便运算'],a:0,exp:'乘除是二级，比加减高一级，所以先算。'},
  {t:'mc',q:'下面哪个算式只有二级运算？',o:['25 ÷ 5 × 3','24 + 15 − 13','49 ÷ 7 + 9','28 − 6 × 3'],a:0,exp:'只有乘和除的是二级运算。'},
 ]});
kp({id:'sx2-tj',s:'sx',u:2,name:'同级运算：从左往右',lesson:'算式里只有加减，或者只有乘除，就叫同级运算。规则最简单：从左往右，一步一步算。比如 24 + 15 − 13，先算 24 + 15 = 39，再算 39 − 13 = 26。',gen:'same'});
kp({id:'sx2-lj',s:'sx',u:2,name:'两级运算：先乘除后加减',lesson:'既有乘除又有加减，就不能从左往右硬算了。先算乘除，再算加减。比如 28 − 6 × 3：先算 6 × 3 = 18，再算 28 − 18 = 10。谁要是先算 28 − 6，就掉坑里了。',gen:'two'});
kp({id:'sx2-kh',s:'sx',u:2,name:'小括号：先算括号里',lesson:'小括号是「插队卡」：有它就先算它里面的。5 × (4 + 2)，先算 4 + 2 = 6，再算 5 × 6 = 30。反过来想：如果题目要求先算加减、再算乘除，就必须给加减加上小括号，不然别人会先算乘除。',gen:'br'});
kp({id:'sx2-gf',s:'sx',u:2,name:'脱式计算的规矩',
 lesson:'脱式计算就是一步一步往下写。三条规矩：等号要上下对齐；这一步没算的数和符号，要原样抄下来；不能跳步。跳步、漏抄、等号歪掉，是最常见的三个错。',
 items:[

function phraseKP(id,u,name,lesson,list){
  const items=[];
  list.forEach(([en,zh])=>{
    const ds=list.filter(x=>x[0]!==en).map(x=>x[0]);
    items.push({t:'mc',en:true,q:`「${zh}」用英语怎么说？`,o:[en,...pick(ds,3)],a:0,exp:`${en} = ${zh}`});
    items.push({t:'mc',q:`<span class="en">${en}</span> 是什么意思？`,o:[zh,...pick(list.filter(x=>x[0]!==en).map(x=>x[1]),3)],a:0,exp:`${en} = ${zh}`});
  });
  kp({id,s:'yy',u,name,lesson,items});
}

let AC=null;
function tone(seq){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime;
    seq.forEach(([f,dur,at])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+at); g.gain.exponentialRampToValueAtTime(0.18,t0+at+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur);
      o.connect(g); g.connect(AC.destination); o.start(t0+at); o.stop(t0+at+dur+0.05);
    });
  }catch(e){}
}

function say(text, lang, rate){

    u.lang = lang==='en' ? 'en-US' : 'zh-CN';

    const pref = VOICES.filter(v => v.lang && v.lang.replace('_','-').toLowerCase().startsWith(lang==='en'?'en':'zh'));

    if(best) u.voice = best;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* 混合运算生成器 */
function fmt(e){ return e.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/-/g,' − '); }
function genCalc(mode){
  let a,b,c,expr,first,wrong,val,steps;
  const R=(lo,hi)=>lo+rnd(hi-lo+1);
  if(mode==='same'){
    const t=rnd(3);
    if(t===0){ a=R(12,60); b=R(11,40); c=R(5,Math.min(a+b,60)); expr=`${a}+${b}-${c}`; first=`${a} + ${b}`; wrong=`${b} − ${c}`; val=a+b-c; steps=`先算 ${a} + ${b} = ${a+b}，再算 ${a+b} − ${c} = ${val}`; }
    else if(t===1){ a=R(30,90); b=R(5,a-10); c=R(5,40); expr=`${a}-${b}+${c}`; first=`${a} − ${b}`; wrong=`${b} + ${c}`; val=a-b+c; steps=`先算 ${a} − ${b} = ${a-b}，再算 ${a-b} + ${c} = ${val}`; }
    else { b=R(2,9); const q=R(2,9); a=b*q; c=R(2,9); expr=`${a}/${b}*${c}`; first=`${a} ÷ ${b}`; wrong=`${b} × ${c}`; val=q*c; steps=`先算 ${a} ÷ ${b} = ${q}，再算 ${q} × ${c} = ${val}`; }
  } else if(mode==='two'){
    const t=rnd(4);
    if(t===0){ b=R(2,9); c=R(2,9); a=R(b*c+1,b*c+40); expr=`${a}-${b}*${c}`; first=`${b} × ${c}`; wrong=`${a} − ${b}`; val=a-b*c; steps=`先算乘法 ${b} × ${c} = ${b*c}，再算 ${a} − ${b*c} = ${val}`; }
    else if(t===1){ a=R(10,50); b=R(2,9); c=R(2,9); expr=`${a}+${b}*${c}`; first=`${b} × ${c}`; wrong=`${a} + ${b}`; val=a+b*c; steps=`先算乘法 ${b} × ${c} = ${b*c}，再算 ${a} + ${b*c} = ${val}`; }
    else if(t===2){ b=R(2,9); const q=R(2,9); a=b*q; c=R(3,30); expr=`${a}/${b}+${c}`; first=`${a} ÷ ${b}`; wrong=`${b} + ${c}`; val=q+c; steps=`先算除法 ${a} ÷ ${b} = ${q}，再算 ${q} + ${c} = ${val}`; }
    else { c=R(2,9); const q=R(2,9); b=c*q; a=R(q+1,q+50); expr=`${a}-${b}/${c}`; first=`${b} ÷ ${c}`; wrong=`${a} − ${b}`; val=a-q; steps=`先算除法 ${b} ÷ ${c} = ${q}，再算 ${a} − ${q} = ${val}`; }
  } else if(mode==='br'){
    const t=rnd(4);
    if(t===0){ a=R(2,9); b=R(1,9); c=R(1,9); expr=`${a}*(${b}+${c})`; first=`${b} + ${c}`; wrong=`${a} × ${b}`; val=a*(b+c); steps=`先算括号里 ${b} + ${c} = ${b+c}，再算 ${a} × ${b+c} = ${val}`; }
    else if(t===1){ c=R(2,9); const q=R(2,9); b=R(1,c*q-1); a=c*q-b; expr=`(${a}+${b})/${c}`; first=`${a} + ${b}`; wrong=`${b} ÷ ${c}`; val=q; steps=`先算括号里 ${a} + ${b} = ${a+b}，再算 ${a+b} ÷ ${c} = ${val}`; }
    else if(t===2){ c=R(2,9); const q=R(2,9); b=R(5,40); a=c*q+b; expr=`(${a}-${b})/${c}`; first=`${a} − ${b}`; wrong=`${b} ÷ ${c}`; val=q; steps=`先算括号里 ${a} − ${b} = ${a-b}，再算 ${a-b} ÷ ${c} = ${val}`; }
    else { const d=R(2,9); const q=R(2,9); a=d*q; c=R(1,d-1); b=d+c; expr=`${a}/(${b}-${c})`; first=`${b} − ${c}`; wrong=`${a} ÷ ${b}`; val=q; steps=`先算括号里 ${b} − ${c} = ${d}，再算 ${a} ÷ ${d} = ${val}`; }
  }
  const shown = fmt(expr);
  if(rnd(2)===0){
    const junk = expr.match(/\d+/g);
    let extra = `${junk[0]} ${mode==='same'?'×':'+'} ${junk[2]}`;
    if(extra===first||extra===wrong) extra = `${junk[0]} − ${junk[2]}`;
    return {kind:'choice',prompt:`算 <span class="big">${shown}</span><span class="zh">第一步先算什么？</span>`,opts:[first,wrong,extra],ans:0,exp:steps+'。'};
  }
  return {kind:'num',prompt:`<span class="big">${shown} = ?</span>`,ans:val,exp:steps+'。'};
}
function genStory(){
  const R=(lo,hi)=>lo+rnd(hi-lo+1); const t=rnd(3);
  let text, right, wrongs, val, exp;
  if(t===0){ const c=R(3,9), k=R(4,12), b=R(20,80), a=b+c*k; val=k;
    text=`果园摘了 ${a} 个西瓜，已经运走 ${b} 个。剩下的每 ${c} 个装一筐，可以装几筐？`;
    right=`(${a} − ${b}) ÷ ${c}`; wrongs=[`${a} − ${b} ÷ ${c}`,`${a} ÷ ${c} − ${b}`,`(${a} + ${b}) ÷ ${c}`];
    exp=`先算剩下多少个：${a} − ${b} = ${a-b}，再算装几筐：${a-b} ÷ ${c} = ${k}。要先算减法，所以减法要加括号。`; }
  else if(t===1){ const a=R(3,8), b=R(2,9), ch=R(2,30), m=a*b+ch; val=ch;
    text=`小明买了 ${a} 本练习本，每本 ${b} 元。他付了 ${m} 元，应该找回多少元？`;
    right=`${m} − ${a} × ${b}`; wrongs=[`(${m} − ${a}) × ${b}`,`${m} − ${a} + ${b}`,`${m} ÷ ${a} − ${b}`];
    exp=`先算一共花了多少：${a} × ${b} = ${a*b} 元，再算找回：${m} − ${a*b} = ${ch} 元。乘法本来就先算，不用括号。`; }
  else { const c=R(3,9), k=R(2,9), r=R(1,c-1), a=c*k+r; val=r;
    text=`一共有 ${a} 个苹果，分给 ${c} 个小朋友，每人 ${k} 个，还剩几个？`;
    right=`${a} − ${c} × ${k}`; wrongs=[`(${a} − ${c}) × ${k}`,`${a} ÷ ${c} − ${k}`,`${a} − ${c} + ${k}`];
    exp=`先算分掉了多少：${c} × ${k} = ${c*k} 个，再算剩下：${a} − ${c*k} = ${r} 个。`; }
  if(rnd(2)===0) return {kind:'choice',prompt:`${text}<span class="zh">列成一个算式，选哪个？</span>`,opts:[right,...wrongs],ans:0,exp};
  return {kind:'num',prompt:`${text}<span class="zh">算出结果</span>`,ans:val,exp};
}
function makeItem(k){
  if(k.word) return wordItem(k);
  if(k.gen==='story') return genStory();
  if(k.gen) return genCalc(k.gen);
  const it = k.items[rnd(k.items.length)];
  const en = !!it.en;
  if(it.t==='mc'){
    const o = it.o.map((s,i)=>({s,i}));
    const sh = shuffle(o);
    return {kind:'choice',en,html:it.html,prompt:it.q,opts:sh.map(x=>x.s),ans:sh.findIndex(x=>x.i===it.a),exp:it.exp};
  }
  if(it.t==='tf') return {kind:'choice',prompt:it.q+'<span class="zh">对不对？</span>',opts:['对 ✓','错 ✗'],ans:it.a?0:1,exp:it.exp,two:true};
  if(it.t==='blank'){
    const m = it.q.match(/【(.+?)】/); const a = m[1];
    const prompt = it.q.replace(/【.+?】/,'<span class="blank">&nbsp;</span>');
    const o = shuffle([a,...it.o]);
    return {kind:'choice',prompt,opts:o,ans:o.indexOf(a),exp:it.exp,two:true,fill:a};
  }
  if(it.t==='order') return {kind:'tiles',en,prompt:esc(it.zh),tokens:shuffle(it.tokens),ans:it.tokens.join(en?' ':''),join:en?' ':'',exp:it.exp,zhTiles:!en,speakAfter:en?{t:it.exp,l:'en'}:null};
  if(it.t==='num') return {kind:'num',prompt:it.q,ans:it.a,exp:it.exp};
}

function buildSession(subj){
  const today = dayN();
  const pool = KPS.filter(k=>!subj || k.s===subj);
  const due = pool.filter(k=>{const r=rec(k.id);return r.box>0 && r.due<=today;});
  const fresh = pool.filter(k=>rec(k.id).box===0);
  const later = pool.filter(k=>{const r=rec(k.id);return r.box>0 && r.due>today;});
  const N = subj ? 12 : 15;
  const newCap = subj ? 6 : 8;
  let list = shuffle(due).sort((a,b)=>rec(a.id).box-rec(b.id).box).slice(0,N);
  // 新知识点：三科轮流拿；英语里单词和语法句型交替，避免单词淹没
  const bySubj = {yw:[],sx:[],yy:[]}; shuffle(fresh).forEach(k=>bySubj[k.s].push(k));
  const yw_ = bySubj.yy.filter(k=>k.word), yg_ = bySubj.yy.filter(k=>!k.word); bySubj.yy=[];
  while(yw_.length||yg_.length){ if(yg_.length) bySubj.yy.push(yg_.shift()); if(yw_.length) bySubj.yy.push(yw_.shift()); }
  let added=0; const order=subj?[subj]:['yw','sx','yy'];
  while(list.length<N && added<newCap){
    let got=false;
    for(const s of order){ if(list.length>=N||added>=newCap) break; const k=bySubj[s].shift(); if(k){list.push(k);added++;got=true;} }
    if(!got) break;
  }
  if(list.length<N) list = list.concat(shuffle(later).slice(0,N-list.length));
  return shuffle(list);
}
function counts(subj){
  const today=dayN(); const pool=KPS.filter(k=>!subj||k.s===subj);
  return {due:pool.filter(k=>{const r=rec(k.id);return r.box>0&&r.due<=today;}).length,
          fresh:pool.filter(k=>rec(k.id).box===0).length, total:pool.length,
          boxes:[0,1,2,3,4].map(b=>pool.filter(k=>rec(k.id).box===b).length)};
}

/* ---------- 答题流程 ---------- */
const PRAISE=['答对了！','漂亮！','就是它！','太棒了！','稳！','厉害了！','没错！','对！'];
const OOPS=['差一点','再看看','没关系，记住它','这题有坑','下次它还会来'];
let Q = null; // 当前关卡
function startSession(subj){
  const list = buildSession(subj);
  if(!list.length){ toast('这一科的题都练过了，去别的科看看'); return; }
  Q = {list, i:0, right:0, ups:[], downs:[], subj, answered:false};
  show('quiz'); nextQ();
}
function nextQ(){
  if(Q.i>=Q.list.length) return finish();
  const k = Q.list[Q.i]; const r = rec(k.id);
  $('#prog').style.width = (Q.i/Q.list.length*100)+'%';
  $('#cnt').textContent = `${Q.i+1}/${Q.list.length}`;
  Q.item = makeItem(k); Q.answered=false; Q.picked=[];
  if(r.seen===0) renderLesson(k, ()=>renderQ(k)); else renderQ(k);
}
function renderLesson(k, go){
  const c=$('#qcard');
  c.innerHTML = `
    <div class="tag"><span class="pill ${k.s}">${SUBJ[k.s].name}</span>新知识点 · 第 ${k.u} 单元</div>

    ${k.word?`<button class="spk" id="spk">🔊 听一听 <span class="en">${esc(k.word.en)}</span></button>`:''}
    <div class="acts"><button class="btn big" id="go">明白了，出题 ▸</button></div>`;
  const sp=$('#spk'); if(sp){ sp.onclick=()=>say(k.word.en,'en'); setTimeout(()=>say(k.word.en,'en'),300); }
  $('#go').onclick=go;
}
function renderQ(k){
  const it=Q.item, c=$('#qcard');
  let body='';
  if(it.kind==='choice'){
    body = `<div class="opts ${it.two||it.opts.length===2?'two':''}" id="opts">${it.opts.map((o,i)=>`<button class="opt ${it.en?'en':''}" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${it.en?esc(o):o}</span></button>`).join('')}</div>`;
  } else if(it.kind==='tiles'){
    body = `<div class="answer-row" id="arow"></div><div class="tiles" id="tiles">${it.tokens.map((t,i)=>`<button class="tile ${it.zhTiles?'zh':''}" data-i="${i}">${esc(t)}</button>`).join('')}</div>
            <div class="acts"><button class="btn ghost sm" id="undo">← 退一个</button><button class="btn" id="check" disabled>好了 ✓</button></div>`;
  } else {
    body = `<div class="numin" id="numin">&nbsp;</div><div class="numpad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`;
  }
  c.innerHTML = `
    <div class="tag"><span class="pill ${k.s}">${SUBJ[k.s].name}</span>${esc(k.name)} · <button id="relesson" style="text-decoration:underline">再讲一遍</button></div>
    ${it.html||''}
    <div class="prompt">${it.prompt}</div>
    ${it.speak?`<button class="spk" id="spk">🔊 再听一遍</button>`:''}
    ${body}
    <div id="fb"></div>`;
  $('#relesson').onclick=()=>openSheet(`<h2>${esc(k.name)}</h2><p style="font-size:17px;line-height:1.7;color:var(--ink2)">${esc(k.lesson)}</p><div class="acts" style="margin-top:14px"><button class="btn sm" onclick="closeSheet()">知道了</button></div>`);
  if(it.speak){ $('#spk').onclick=()=>say(it.speak.t,it.speak.l); if(it.auto||k.word) setTimeout(()=>say(it.speak.t,it.speak.l),250); }
  if(it.kind==='choice'){
    c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  } else if(it.kind==='tiles'){
    const arow=$('#arow'), tiles=$('#tiles');
    const redraw=()=>{ arow.innerHTML=Q.picked.map(i=>`<span class="tile ${it.zhTiles?'zh':''}">${esc(it.tokens[i])}</span>`).join(''); tiles.querySelectorAll('.tile').forEach(t=>t.classList.toggle('used',Q.picked.includes(+t.dataset.i))); $('#check').disabled = Q.picked.length!==it.tokens.length; };
    tiles.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{ if(Q.answered) return; Q.picked.push(+t.dataset.i); redraw(); });
    $('#undo').onclick=()=>{ if(Q.answered) return; Q.picked.pop(); redraw(); };
    $('#check').onclick=()=>answer(Q.picked.map(i=>it.tokens[i]).join(it.join));
  } else {
    let v='';
    c.querySelectorAll('.numpad button').forEach(b=>b.onclick=()=>{
      if(Q.answered) return; const n=b.dataset.n;
      if(n==='⌫') v=v.slice(0,-1); else if(n==='✓'){ if(v!=='') answer(+v); return; } else if(v.length<5) v+=n;
      $('#numin').innerHTML = v||'&nbsp;';
    });
  }
}
function answer(val){
  if(Q.answered) return; Q.answered=true;
  const k=Q.list[Q.i], it=Q.item;
  const ok = it.kind==='choice' ? val===it.ans : it.kind==='tiles' ? String(val).toLowerCase()===String(it.ans).toLowerCase() : val===it.ans;
  // 存档
  const r = rec(k.id), today=dayN(), before=r.box;
  r.seen++; if(ok){ r.ok++; r.box=Math.min(4,r.box+1); } else { r.ng++; r.box=Math.max(1,r.box-1); }
  r.due = today + (ok ? IV[r.box] : 1);
  S.kp[k.id]=r;
  const d = S.days[today] || {n:0,ok:0}; d.n++; if(ok) d.ok++; S.days[today]=d;
  save();
  if(ok) Q.right++;
  if(r.box>before && r.box>=2) Q.ups.push({k,box:r.box});
  if(r.box<before) Q.downs.push({k,box:r.box});
  // 界面反馈
  if(it.kind==='choice'){
    document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const i=+b.dataset.i; if(i===it.ans) b.classList.add('right'); else if(i===val) b.classList.add('wrong'); });
    if(it.fill) $('.blank').textContent = it.fill;
  } else if(it.kind==='tiles'){
    $('#arow').classList.add(ok?'right':'wrong'); $('#check').disabled=true; $('#undo').disabled=true;
  } else {
    $('#numin').classList.add(ok?'right':'wrong');
  }
  ok ? sndOK() : sndBad();
  if(ok && r.box>before && r.box>=2) setTimeout(sndUp,300);
  if(it.speakAfter) setTimeout(()=>say(it.speakAfter.t,it.speakAfter.l),400);
  const levelMsg = (ok && r.box>before && r.box>=2) ? `<div class="chip up">⭐ ${esc(k.name)} 升到「${BOXNAME[r.box]}」</div>` : '';
  const correctText = !ok ? `<div>正确答案：<b>${it.kind==='choice'?(it.en?esc(it.opts[it.ans]):it.opts[it.ans]):esc(it.ans)}</b></div>` : '';
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}">
      <div class="head">${ok?PRAISE[rnd(PRAISE.length)]:OOPS[rnd(OOPS.length)]}</div>
      ${correctText}<div class="exp">${it.exp||''}</div>${levelMsg}
      <div class="acts"><button class="btn big" id="next">${Q.i+1>=Q.list.length?'看看成绩 ▸':'下一题 ▸'}</button></div></div>`;
  $('#next').onclick=()=>{ Q.i++; nextQ(); };
  $('#next').focus();
}
function finish(){
  const today=dayN();
  if(S.lastDay!==today){ S.streak = (S.lastDay===today-1) ? S.streak+1 : 1; S.lastDay=today; }
  S.sessions++; save();
  const n=Q.list.length, r=Q.right;
  const msg = r===n ? '全对！这一关被你踩平了。' : r>=n*0.8 ? '很稳。错的那几个明天还会来找你。' : r>=n*0.5 ? '有几个新面孔，多见几次就熟了。' : '今天的题偏难，没关系，错题会在明天再出现。';
  $('#result').innerHTML = `
    <div class="muted">今天这一关</div>
    <div class="score num">${r}<small> / ${n}</small></div>
    <p style="font-size:17px;max-width:32ch">${msg}</p>
    ${Q.ups.length?`<div><div class="muted" style="margin-bottom:6px">升级的知识点</div><div class="ups">${Q.ups.map(u=>`<span class="chip up">⭐ ${esc(u.k.name)} → ${BOXNAME[u.box]}</span>`).join('')}</div></div>`:''}
    ${Q.downs.length?`<div><div class="muted" style="margin-bottom:6px">掉了一级，明天再来</div><div class="ups">${Q.downs.map(u=>`<span class="chip down">${esc(u.k.name)}</span>`).join('')}</div></div>`:''}
    <div class="muted">连续 <b class="num" style="color:var(--yw);font-size:18px">${S.streak}</b> 天 · 今天够了，明天见</div>
    <div class="acts" style="width:100%"><button class="btn ghost" style="flex:1" onclick="show('map')">看地图</button><button class="btn" style="flex:1" onclick="show('home')">回首页</button></div>`;
  show('done');
  if(r===n) sndUp();
}

function dictStart(id){

}

    </div>
    <div class="sec"><h3>听写写错的词</h3>${dw?`<table><tbody>${dw}</tbody></table>`:'<p class="muted">还没有听写记录，或者全对。</p>'}</div>
    <div class="sec"><h3>各科进度</h3><table><thead><tr><th>科目</th><th class="n">没见过</th><th class="n">刚学</th><th class="n">铜</th><th class="n">银</th><th class="n">金</th><th class="n">待复习</th></tr></thead><tbody>
      ${Object.keys(SUBJ).map(s=>{const cc=counts(s);return `<tr><td>${SUBJ[s].name}</td>${cc.boxes.map(n=>`<td class="n">${n}</td>`).join('')}<td class="n">${cc.due}</td></tr>`;}).join('')}</tbody></table></div>
    <div class="sec"><h3>备份与恢复</h3>
      <p class="muted" style="margin-bottom:8px">进度存在这台设备的浏览器里。换设备时，把下面这段复制过去，粘贴后点「恢复」。</p>
      <textarea id="dump" readonly>${esc(JSON.stringify(S))}</textarea>
      <div class="row-btns" style="margin-top:8px"><button class="tiny" id="copy">复制备份</button><button class="tiny" id="restore">从粘贴板恢复</button><button class="tiny danger" id="reset">清空全部进度</button></div>
      <p class="muted" style="margin-top:10px">题库：第 1、2 单元，语文 ${counts('yw').total} · 数学 ${counts('sx').total} · 英语 ${counts('yy').total} 个知识点。复习间隔 1 / 3 / 7 / 14 天，答错降一级、次日再出。</p>
    </div>`;
  $('#copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast('已复制'); }catch(e){ $('#dump').select(); toast('长按文本框全选复制'); } };
  $('#restore').onclick=async()=>{ let t=''; try{ t=await navigator.clipboard.readText(); }catch(e){ t=prompt('把备份内容粘贴到这里')||''; } try{ const o=JSON.parse(t); if(o&&o.kp){ S=o; save(); toast('已恢复'); renderParent(); } else toast('内容不对'); }catch(e){ toast('内容不对'); } };
  $('#reset').onclick=()=>{ if(confirm('确定清空全部进度？这个操作不能撤销。')){ localStorage.removeItem('kq1'); load(); toast('已清空'); renderParent(); } };
}

/* ---------- 启动 ---------- */
load();
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#btn-start').onclick=()=>startSession(null);
$('#btn-quit').onclick=()=>{ if(Q && Q.i>0 && !confirm('这一关还没打完，先退出吗？已经答过的题都记下了。')) return; show('home'); };
$('#sheet').addEventListener('click',e=>{ if(e.target===$('#sheet')) closeSheet(); });
show('home');
</script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
